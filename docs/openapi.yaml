openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer 
            minimum: 1
            maximum: 100
          description: Jumlah produk per halaman untuk paginasi (default 15)
        - in: query
          name: sort
          schema:
            type: string
            enum: ['name', '-name', 'price', '-price']
          description: Pengurutan data produk berdasarkan nama atau harga (tanda minus untuk descending)
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
          description: Pencarian berdasarkan nama produk
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter produk berdasarkan ID kategori
      responses:
        '200':
          description: Daftar produk (berpaginasi)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }
                  links:
                    type: object
                    description: Link navigasi paginasi (first, last, prev, next)
                  meta:
                    type: object
                    description: Meta informasi paginasi (current_page, per_page, total, dll)
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid (misalnya per_page melebihi batas)
  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
